{% load harit_extras %}
<div class="dealer">
  <div class="top">
    <div><h3>{{ d.name }}</h3><div class="area">{{ d.area }}</div></div>
    {% if d.is_verified %}<span class="badge-v"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10" fill="#1E4D3B" stroke="none"/><path d="M8 12.5l2.6 2.6L16 9.6" stroke="#fff"/></svg>Verified</span>{% endif %}
  </div>
  <div class="cats">{% for c in d.categories.all %}<span>{{ c.name }}</span>{% endfor %}</div>
  <div class="desc">{{ d.desc|default:d.description }}{% if d.since %} <span style="color:#9AA69F">· Since {{ d.since }}</span>{% endif %}</div>
  <div class="actions">
    <a class="call" href="tel:{{ d.phone|clean_phone }}">Call {{ d.phone }}</a>
    <a class="wa" href="{% wa_link d.whatsapp 'Hi, I found you on RenSetu (the green energy directory). I would like to enquire about your services.' %}" target="_blank">
      <svg class="wa-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.8 1.9.8 2c.1.1.1.3 0 .5l-.4.6c-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg> WhatsApp
    </a>
  </div>
</div>
